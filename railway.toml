# Railway Configuration - Production Ready
# Following Railway best practices for CodeWorkspace deployment

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production]
variables = { NODE_ENV = "production" }

[environments.staging]
variables = { NODE_ENV = "staging" }

# Backend Service Configuration
[[services]]
name = "backend"
source = "api"

[services.variables]
NODE_ENV = "production"
PORT = "3001"
# Use Railway reference variables for service communication
# DATABASE_URL will be auto-injected by Railway MongoDB service

# Frontend Service Configuration
[[services]]
name = "frontend" 
source = "."

[services.variables]
NODE_ENV = "production"
# Frontend will use reference variables for backend communication
# VITE_API_URL = "${{backend.RAILWAY_PUBLIC_DOMAIN}}"
